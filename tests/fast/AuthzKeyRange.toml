# POC end-to-end check for per-identity key-range authorization.
# See src/design/key-range-authz.md.
#
# What this exercises:
#   - AuthzPolicyCache loading policy from \xff/authz/policy/...
#   - CommitProxy + StorageServer enforcement gated by AUTHZ_ENFORCEMENT_ENABLED.
#   - Real X509 cert (mkcert::makeSelfSignedCertWithCN) minted per simulated process; CN
#     extracted via the same OpenSSL parser the production SSLConnection uses.

[configuration]
# Pin TLS on for every run. The simulator otherwise rolls sslEnabled at 10%, which would
# make this test non-deterministic w.r.t. TLS topology.
forceSSL = true

[[knobs]]
authz_enforcement_enabled = true
authz_initial_admin_cn = "test-admin"
# Short staleness limit so the cache picks up the policy write quickly.
authz_cache_staleness_limit_ms = 3000

[[test]]
testTitle = "AuthzKeyRange"

    [[test.workload]]
    testName = "AuthzKeyRange"
